<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Employees')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="container-fluid px-4">
  <h4 class="mb-3">Employees</h4>
  <div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div>
  <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
  <div class="row g-4">
    <div class="col-lg-4">
      <form class="card p-3" method="post" th:action="@{/employees}" enctype="multipart/form-data">
        <h5 th:text="${emp.id == null} ? 'Add employee' : 'Edit employee'"></h5>
        <input type="hidden" name="id" th:value="${emp.id}">
        <input class="form-control mb-2" aria-label="Employee code" maxlength="255" name="code" th:value="${emp.code}" placeholder="Employee code" required>
        <input class="form-control mb-2" aria-label="Full name" maxlength="255" name="fullName" th:value="${emp.fullName}" placeholder="Full name" required>
        <input class="form-control mb-2" aria-label="Department" maxlength="255" name="department" th:value="${emp.department}" placeholder="Department">
        <input class="form-control mb-2" aria-label="Device User ID" maxlength="255" name="biometricId" th:value="${emp.biometricId}" placeholder="Device User ID (PIN) - defaults to code">
        <select class="form-select mb-2" name="shiftId" aria-label="Assigned shift"><option value="">No shift</option>
          <option th:each="s : ${shifts}" th:value="${s.id}" th:text="${s.name}" th:selected="${emp.shift != null and emp.shift.id == s.id}"></option></select>
        <input class="form-control mb-2" type="file" name="photo" accept="image/jpeg,image/png,image/gif" aria-label="Employee photo">
        <button class="btn btn-primary" th:text="${emp.id == null} ? 'Add employee' : 'Save changes'">Save</button>
        <a th:if="${emp.id != null}" href="/employees" class="btn btn-outline-secondary mt-2">Cancel editing</a>
      </form>
      <form class="card p-3 mt-3" method="post" th:action="@{/employees/import}" enctype="multipart/form-data">
        <h6>Import CSV <small class="text-muted">(code,name,department,biometricId)</small></h6>
        <input class="form-control mb-2" type="file" name="file" accept=".csv" required>
        <small class="text-muted mb-2">CSV header: code,name,department,biometricId. Existing codes are updated.</small>
        <button class="btn btn-outline-primary btn-sm">Import</button>
      </form>
    </div>
    <div class="col-lg-8"><div class="table-responsive"><table class="table table-sm align-middle">
      <thead><tr><th>Code</th><th>Name</th><th>Dept</th><th>Device ID</th><th>Shift</th><th>Status</th><th></th></tr></thead>
      <tbody><tr th:if="${#lists.isEmpty(employees)}"><td colspan="7" class="text-muted">No employees yet. Add your first employee using the form.</td></tr><tr th:each="e : ${employees}">
        <td th:text="${e.code}"></td><td th:text="${e.fullName}"></td><td th:text="${e.department}"></td>
        <td th:text="${e.biometricId}"></td><td th:text="${e.shift != null} ? ${e.shift.name} : '-'"></td>
        <td><span th:class="'badge text-bg-' + (${e.active} ? 'success' : 'secondary')" th:text="${e.active} ? 'Active' : 'Inactive'"></span></td>
        <td class="text-nowrap"><a class="btn btn-sm btn-outline-secondary" th:href="@{/employees(edit=${e.id})}">Edit</a>
          <form class="d-inline" method="post" th:action="@{/employees/{id}/toggle(id=${e.id})}"><button class="btn btn-sm btn-outline-warning" th:text="${e.active} ? 'Deactivate' : 'Activate'"></button></form></td>
      </tr></tbody></table></div></div>
  </div>
</div>
</body></html>
