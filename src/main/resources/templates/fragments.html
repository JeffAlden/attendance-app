<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title th:text="${title}">Attendance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="/js/theme.js"></script>
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand-md bg-body-tertiary mb-3">
  <div class="container-fluid">
    <a class="navbar-brand" href="/dashboard">Attendance</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nv"><span class="navbar-toggler-icon"></span></button>
    <div id="nv" class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
        <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','HR')"><a class="nav-link" href="/logs">Logs</a></li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" href="/employees">Employees</a></li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" href="/shifts">Shifts</a></li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" href="/simulator">Simulator</a></li>
      </ul>
      <button class="btn btn-sm btn-outline-secondary me-2" onclick="toggleTheme()">Dark / Light</button>
      <form th:action="@{/logout}" method="post" class="m-0"><button class="btn btn-sm btn-outline-danger">Logout</button></form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</nav>
</body></html>
